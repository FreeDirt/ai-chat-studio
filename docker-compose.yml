
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_chat_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor        # don't mount local vendor over container's
    env_file:
      - .env.docker
    networks:
      - ai_chat_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ai_chat_nginx
    restart: unless-stopped
    ports:
      - "8015:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ai_chat_network
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: ai_chat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ai_chat
      MYSQL_USER: ai_chat_user
      MYSQL_PASSWORD: secret
    ports:
      - "3315:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ai_chat_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

networks:
  ai_chat_network:
    driver: bridge

volumes:
  db_data:
    driver: local
